services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: keystone-falkordb
    ports:
      - "6379:6379"   # FalkorDB server (RESP)
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keystone:
    build: .
    container_name: keystone-app
    ports:
      - "8000:8000"
    environment:
      FALKOR_HOST: falkordb
      # Set GEMINI_API_KEY in the environment (or a .env file) to enable the
      # LLM agent. Without it the deterministic router answers instead.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb-data:
