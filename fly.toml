# Fly.io: one machine running FalkorDB and the app together.
#
# Deploy:  fly launch --no-deploy --copy-config  &&  fly deploy
app = "keystone-graph"
primary_region = "sin"   # change to your nearest region

[build]
  dockerfile = "Dockerfile.allinone"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  # The graph is small, but FalkorDB plus Python needs headroom at boot.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
